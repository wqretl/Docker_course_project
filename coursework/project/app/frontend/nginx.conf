# =============================================================================
# Конфигурация nginx для frontend-контейнера
# =============================================================================
# nginx выполняет две функции:
#
# 1. Статический веб-сервер — отдает файлы (index.html, CSS, JS, изображения)
#    из каталога /usr/share/nginx/html при обращении к корневому пути /.
#
# 2. Обратный прокси (reverse proxy) — перенаправляет все запросы, начинающиеся
#    с /api/, на backend-контейнер. Благодаря этому браузер обращается
#    к одному адресу (nginx), а nginx распределяет запросы между статикой
#    и API. Это устраняет необходимость в кросс-доменных запросах (CORS)
#    в production-среде и упрощает сетевую архитектуру.
# =============================================================================

server {
    # Порт, на котором nginx принимает входящие HTTP-соединения внутри контейнера.
    # В Docker Compose или Kubernetes этот порт маппится на внешний порт хоста
    # или публикуется через Service/Ingress.
    listen 80;

    # -------------------------------------------------------------------------
    # Обслуживание статических файлов
    # -------------------------------------------------------------------------
    # Все запросы, не попадающие под более специфичные блоки location,
    # обрабатываются здесь. nginx ищет запрошенный файл в каталоге root
    # и возвращает его. Если запрошен путь "/" — возвращается index.html.
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # -------------------------------------------------------------------------
    # Проксирование запросов к backend API
    # -------------------------------------------------------------------------
    # Все запросы с префиксом /api/ перенаправляются на backend-контейнер.
    #
    # Имя "backend" — это DNS-имя сервиса, которое разрешается внутри
    # контейнерной сети. В Docker Compose оно совпадает с именем сервиса
    # в docker-compose.yml. В Kubernetes — с именем Service-рес��рса.
    #
    # Порт 8000 — порт, на котором backend-приложение (Express) принимает
    # соединения (задается переменной PORT в app.js).
    location /api/ {
        proxy_pass http://backend:8000;

        # Передаем оригинальный заголовок Host от клиента, чтобы backend
        # мог корректно определить, к какому хосту обращался клиент.
        proxy_set_header Host $host;

        # Передаем реальный IP-адрес клиента. Без этого заголовка backend
        # видит в качестве источника запроса IP-адрес nginx-контейнера,
        # а не реального пользователя.
        proxy_set_header X-Real-IP $remote_addr;
    }
}
